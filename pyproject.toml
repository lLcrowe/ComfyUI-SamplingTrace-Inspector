[project]
name = "comfyui-samplingtrace-inspector"
version = "0.4.0b3"
description = "Preview-driven execution and sampling trace inspector for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "lLcrowe" }]
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/lLcrowe/ComfyUI-SamplingTrace-Inspector"
Issues = "https://github.com/lLcrowe/ComfyUI-SamplingTrace-Inspector/issues"

[tool.comfy]
PublisherId = "local-rnd"
DisplayName = "ComfyUI Sampling Trace Inspector"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
